<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Girard Park - Festival Planning</title>

  <!-- The key is limited to this page's address, to the tent layer and the ortho, and expires.
       Paste it between the quotes. -->
  <script>
    var esriConfig = { apiKey: "AAPTaBPH8cCUwLxKFmbYZYdS4hQ..dBNvxxGIP8VLJLtbn3OgCnhesJvp50RFTX3umM9Lmgm9aML4uUK3uVRVNEznWxTUohLQVoqwLEwjU288eE_SolqpKY96X-RC5mT9MXdHe8xjTmYtGz4oI_NfTKIuNuBr-_J2PFQCBNzIqJS6h6K8Udgypl8WomWVJovOn0qANgsXyb8ZqicUZIb-IWRK3MVpCYo4FoyehRizAK0-HkmkWx5YSW_oO0XywbATShHhUlFo2PFiOkcQwGQ-bMO4CroAeTDm3Iqvm1ix563bVdpQHg..AT1_wY8WhWGL" };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>

  <style>
    /* Layout: black brand bar, status chips as filter and legend, the map filling the rest,
       one action bar over the map, and a side sheet (bottom sheet on phones) for spots. */
    :root {
      --black: #000000;            /* brand black */
      --yellow: #FDD023;           /* brand yellow (Pantone 123 C) */
      --ink: #1a1a1a;
      --grey-80: #333333;          /* black tints from the brand kit */
      --grey-60: #666666;
      --grey-40: #999999;
      --grey-20: #cccccc;
      --wash: #f3f3f1;
      --paper: #ffffff;
      --open: #2E9E5B; --held: #2F6FD6; --rented: #D9483B; --blocked: #8A8F98;
      --font: "Roboto", "Helvetica Neue", Arial, sans-serif;
      --radius: 6px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink);
      font: 15px/1.4 var(--font); }
    button, input, select, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }

    /* brand bar */
    .brand { display: flex; align-items: center; gap: 14px; background: var(--black); color: var(--paper);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; }
    .brand img { height: 22px; width: auto; display: block; }
    .brand .rule { width: 1px; align-self: stretch; background: var(--grey-80); }
    .brand .name { display: flex; flex-direction: column; min-width: 0; }
    .brand .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--yellow); font-weight: 700; }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: -0.01em; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .brand .find { margin-left: auto; background: transparent; border: 1px solid var(--grey-60); color: var(--paper);
      border-radius: var(--radius); padding: 7px 12px; min-height: 38px; cursor: pointer; }
    .brand .find:hover { border-color: var(--paper); }

    /* status chips: filter and legend in one */
    .chips { display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--grey-20);
      overflow-x: auto; scrollbar-width: none; background: var(--paper); }
    .chips::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border: 1px solid var(--grey-20);
      background: var(--paper); border-radius: 99px; padding: 5px 12px 5px 9px; min-height: 34px; cursor: pointer;
      font-size: 13px; font-weight: 500; }
    .chip .sw { width: 12px; height: 12px; border-radius: 3px; }
    .chip .n { font-variant-numeric: tabular-nums; color: var(--grey-60); font-weight: 400; }
    .chip.off { opacity: .45; }
    .chip.off .sw { background: transparent !important; outline: 2px solid var(--grey-40); outline-offset: -2px; }
    .fees { margin-left: auto; white-space: nowrap; font-size: 13px; color: var(--grey-60); font-variant-numeric: tabular-nums; }
    .fees b { color: var(--ink); font-weight: 700; }
    .scale-read { position: absolute; z-index: 3; right: 12px; top: 12px; background: rgba(0,0,0,.72); color: var(--paper);
      border-radius: var(--radius); padding: 4px 9px; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }

    main { flex: 1; position: relative; min-height: 0; }
    arcgis-map { position: absolute; inset: 0; }

    /* action bar over the map */
    .actions { position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center;
      background: var(--paper); border-radius: 10px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25);
      max-width: calc(100% - 32px); }
    .btn { border: 1px solid var(--grey-20); background: var(--paper); border-radius: var(--radius);
      padding: 9px 14px; min-height: 42px; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .btn:hover { border-color: var(--grey-40); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--black); font-weight: 700; }
    .btn.dark { background: var(--black); border-color: var(--black); color: var(--paper); }
    .btn.danger { color: var(--rented); }
    .btn.danger.armed { background: var(--rented); border-color: var(--rented); color: var(--paper); }

    /* the bar shown while placing or adjusting a tent */
    .workbar { position: absolute; z-index: 5; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 32px));
      background: var(--yellow); color: var(--black); border-radius: 10px; padding: 10px 10px 10px 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .workbar .what { flex: 1 1 200px; min-width: 0; }
    .workbar .what b { display: block; font-size: 14px; }
    .workbar .what span { font-size: 13px; }
    .workbar .btn { border-color: var(--black); }
    .rowctl { flex-basis: 100%; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .rowctl input { width: 64px; padding: 7px 8px; border: 1px solid var(--black); border-radius: var(--radius); background: var(--paper); }

    /* size menu */
    #printMenu { max-height: calc(100% - 110px); overflow: auto; }
    .menu { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
      bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3); padding: 12px; width: min(340px, calc(100% - 32px)); display: grid; gap: 8px; }
    .menu h3 { margin: 0 0 2px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey-60); }
    .menu .size { display: flex; justify-content: space-between; align-items: center; text-align: left; }
    .menu .size small { color: var(--grey-60); font-weight: 400; }
    .menu .custom { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .menu .custom input { width: 64px; padding: 8px; border: 1px solid var(--grey-20); border-radius: var(--radius); }

    .mapbtn { background: var(--paper); border: 0; border-radius: 0; min-width: 32px; min-height: 32px; padding: 6px 8px;
      font-size: 12px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.3); color: var(--ink); }
    .mapbtn:hover { background: var(--wash); }
    .mapbtn.on { background: var(--black); color: var(--paper); }
    .hint { position: absolute; z-index: 3; left: 50%; top: 12px; transform: translateX(-50%);
      background: rgba(0,0,0,.82); color: var(--paper); padding: 7px 12px; border-radius: var(--radius); font-size: 13px;
      pointer-events: none; max-width: calc(100% - 140px); text-align: center; }
    .hint:empty { display: none; }

    /* side sheet */
    .sheet { position: absolute; z-index: 7; right: 12px; top: 12px; bottom: 12px; width: 340px; display: flex;
      flex-direction: column; background: var(--paper); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
      overflow: hidden; }
    .sheet header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--grey-20); }
    .sheet header h2 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet .x { border: 0; background: transparent; font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; color: var(--grey-60); }
    .sheet .body { padding: 14px; overflow: auto; flex: 1; min-height: 0; display: grid; gap: 12px; align-content: start; }
    .sheet .foot { padding: 12px 14px; border-top: 1px solid var(--grey-20); display: flex; gap: 8px; flex-wrap: wrap; }
    .sheet .foot .btn { flex: 1; }
    .status-pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; color: var(--paper); }
    dl.info { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
    dl.info dt { color: var(--grey-60); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
    dl.info dd { margin: 0; overflow-wrap: anywhere; }
    .field { display: grid; gap: 5px; }
    .field label, .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--grey-60); font-weight: 500; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--grey-20);
      border-radius: var(--radius); background: var(--paper); }
    .field textarea { min-height: 64px; resize: vertical; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .seg button { border: 1px solid var(--grey-20); background: var(--paper); border-radius: var(--radius); padding: 8px 2px;
      min-height: 40px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .seg button.on { color: var(--paper); }
    .msg { font-size: 13px; color: var(--grey-60); min-height: 18px; }
    .msg.err { color: var(--rented); }
    .search-box { width: 100%; padding: 10px 12px; border: 1px solid var(--grey-40); border-radius: var(--radius); }
    .list { display: grid; }
    .row { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center; text-align: left;
      border: 0; border-bottom: 1px solid var(--wash); background: transparent; padding: 10px 2px; cursor: pointer; }
    .row:hover { background: var(--wash); }
    .row .sw { width: 12px; height: 12px; border-radius: 3px; }
    .row .t { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .r { font-size: 13px; color: var(--grey-60); font-variant-numeric: tabular-nums; }
    .row .s { grid-column: 2 / 4; font-size: 13px; color: var(--grey-60); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--grey-60); font-size: 14px; padding: 8px 0; }

    .toast { position: absolute; z-index: 8; left: 50%; transform: translateX(-50%);
      bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--black); color: var(--paper);
      border-radius: var(--radius); padding: 8px 8px 8px 14px; display: flex; gap: 12px; align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 32px); font-size: 14px; }
    .toast button { background: transparent; color: var(--yellow); border: 0; font-weight: 700; cursor: pointer; padding: 6px 8px; }

    .seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .seg3 button { border: 1px solid var(--grey-20); background: var(--paper); border-radius: var(--radius); padding: 8px 4px; min-height: 38px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .seg3 button.on { background: var(--black); border-color: var(--black); color: var(--paper); }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; }
    .checks label { display: flex; gap: 6px; align-items: center; }
    .shield { position: absolute; inset: 0; z-index: 9; background: var(--paper); }
    .statusbar { position: absolute; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 32px));
      color: var(--ink); text-align: center; }
    .sb-text { font-size: 15px; font-weight: 500; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
    .sb-track { height: 8px; background: var(--grey-20); border-radius: 4px; overflow: hidden; }
    .sb-fill { height: 100%; width: 0; background: var(--yellow); transition: width .2s; }
    .blocker { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--paper);
      padding: 24px; text-align: center; color: var(--grey-60); }
    [hidden] { display: none !important; }

    @media (max-width: 640px) {
      .brand { gap: 10px; }
      .brand img { height: 18px; }
      .brand .rule, .brand .eyebrow { display: none; }
      .brand h1 { font-size: 14px; }
      .sheet { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 58%; border-radius: 14px 14px 0 0;
        padding-bottom: env(safe-area-inset-bottom, 0px); }
      arcgis-zoom { display: none; }
      .fees { margin-left: 4px; }
      .actions { gap: 4px; padding: 4px; }
      .actions .btn { padding: 8px 9px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .sheet, .workbar, .menu, .toast { animation: rise .16s ease-out; }
      @keyframes rise { from { opacity: 0; translate: 0 8px; } to { opacity: 1; translate: 0 0; } }
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="logo.png" alt="Company logo" width="480" height="104" />
    <span class="rule"></span>
    <div class="name"><span class="eyebrow">Girard Park</span><h1>Festival Planning</h1></div>
    <button class="find" id="openList" aria-label="Find a spot">Find a spot</button>
  </div>

  <div class="chips" id="chips"></div>

  <main>
    <arcgis-map popup-disabled>
      <arcgis-zoom slot="top-left"></arcgis-zoom>
      <arcgis-home slot="top-left"></arcgis-home>
      <arcgis-locate slot="top-left"></arcgis-locate>
      <arcgis-compass slot="top-left"></arcgis-compass>
      <arcgis-distance-measurement-2d slot="top-right" unit="feet" id="measure" hidden></arcgis-distance-measurement-2d>
    </arcgis-map>
    <div class="hint" id="hint"></div>
    <div class="scale-read" id="scaleRead" title="Scale on the ground, the same figure ArcGIS Pro shows"></div>

    <div class="actions" id="actions">
      <button class="btn primary" id="addBtn" aria-haspopup="true">+ Add</button>
      <button class="btn" id="listBtn">Spot list</button>
      <button class="btn" id="measureBtn" aria-pressed="false">Measure</button>
      <button class="btn" id="printBtn" aria-haspopup="true">Export</button>
      <button class="btn" id="undoBtn" disabled>Undo</button>
    </div>

    <div class="menu" id="printMenu" hidden>
      <h3>PDF</h3>
      <div class="seg3" id="pdfArea">
        <button type="button" data-area="park" class="on">Whole park</button>
        <button type="button" data-area="view">Current view</button>
        <button type="button" data-area="box">Draw a box</button>
      </div>
      <div class="two">
        <label class="field" for="printPaper"><span class="label">Paper</span>
          <select id="printPaper">
            <option value="11x8.5" selected>Letter</option><option value="17x11">Tabloid, 11 x 17</option>
            <option value="24x18">Arch C, 18 x 24</option><option value="36x24">Arch D, 24 x 36</option><option value="48x36">Arch E, 36 x 48</option>
          </select></label>
        <label class="field" for="pdfOrient"><span class="label">Orientation</span>
          <select id="pdfOrient"><option value="landscape" selected>Landscape</option><option value="portrait">Portrait</option></select></label>
      </div>
      <div class="two">
        <label class="field" for="printScale"><span class="label">Scale</span>
          <select id="printScale"><option value="0" selected>Fill the paper</option><option value="500">1:500</option><option value="1000">1:1,000</option><option value="1500">1:1,500</option><option value="2000">1:2,000</option><option value="3000">1:3,000</option></select></label>
        <label class="field" for="pdfDpi"><span class="label">Ortho detail</span>
          <select id="pdfDpi"><option value="150">Standard, 150 dpi</option><option value="300" selected>High, 300 dpi</option></select></label>
      </div>
      <div class="msg" id="printPlan"></div>
      <label class="field" for="pdfTitle"><span class="label">Title</span><input id="pdfTitle" value="Girard Park" /></label>
      <label class="field" for="pdfSub"><span class="label">Subtitle</span><input id="pdfSub" value="Oct 9, 2026 - Drone Ortho" /></label>
      <div class="checks">
        <label><input type="checkbox" id="pdfTents" checked /> Tent spots</label>
        <label><input type="checkbox" id="pdfFeat" checked /> Festival features</label>
        <label><input type="checkbox" id="pdfLegend" checked /> Legend</label>
        <label><input type="checkbox" id="pdfInfo" checked /> Include spot info</label>
      </div>
      <button class="btn primary" id="pdfGo">Download PDF</button>
    </div>

    <div class="menu" id="menu" hidden>
      <h3>Tent size</h3>
      <button class="btn size" data-size="10 x 10 ft">10 x 10 ft <small>$100</small></button>
      <button class="btn size" data-size="20 x 20 ft">20 x 20 ft <small>$150</small></button>
      <button class="btn size" data-size="Company branded">Company branded <small>up to 20 x 20, $500</small></button>
      <div class="custom">
        <span>Custom</span>
        <input id="cw" type="number" min="1" step="1" value="10" aria-label="Custom width in feet" /> x
        <input id="cd" type="number" min="1" step="1" value="20" aria-label="Custom depth in feet" /> ft
        <button class="btn" id="customGo">Add</button>
      </div>
      <div id="featMenu" hidden style="display:grid;gap:8px">
        <h3>Festival feature</h3>
        <div class="custom"><select id="ptKind" aria-label="Kind of point"></select><button class="btn" id="ptGo">Place a point</button></div>
        <div class="custom"><select id="arKind" aria-label="Kind of area"></select><button class="btn" id="arGo">Draw an area</button></div>
      </div>
    </div>

    <!-- placing a festival point, drawing an area, or moving a point; nothing saved until Save -->
    <div class="workbar" id="refbar" hidden>
      <div class="what"><b id="rbTitle"></b><span id="rbText"></span></div>
      <button class="btn" id="rbBack">Undo corner</button>
      <button class="btn dark" id="rbOk">Save</button>
      <button class="btn" id="rbCancel">Cancel</button>
    </div>

    <div class="workbar" id="workbar" hidden>
      <div class="what"><b id="wTitle"></b><span id="wText"></span></div>
      <button class="btn" id="wRow">Make a row</button>
      <button class="btn dark" id="wOk"></button>
      <button class="btn" id="wCancel">Cancel</button>
      <div class="rowctl" id="rowCtl" hidden>
        <label for="rowN">Tents</label><input id="rowN" type="number" min="2" max="50" step="1" value="5" />
        <label for="rowGap">Gap</label><input id="rowGap" type="number" min="0" step="1" value="0" /> ft
      </div>
    </div>

    <div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo">Undo</button></div>

    <aside class="sheet" id="sheet" hidden>
      <header><h2 id="sTitle"></h2><button class="x" id="sClose" aria-label="Close">&times;</button></header>

      <!-- a tent, read only -->
      <div class="body" id="viewPane" hidden>
        <div><span class="status-pill" id="vStatus"></span></div>
        <dl class="info">
          <dt>Size</dt><dd id="vSize"></dd>
          <dt>Renter</dt><dd id="vRenter"></dd>
          <dt>Fee</dt><dd id="vFee"></dd>
          <dt>Year</dt><dd id="vYear"></dd>
          <dt>Notes</dt><dd id="vNotes"></dd>
        </dl>
        <div class="msg" id="vMsg"></div>
      </div>
      <div class="foot" id="viewFoot" hidden>
        <button class="btn primary" id="vEdit">Edit details</button>
        <button class="btn" id="vMove">Move or turn</button>
      </div>

      <!-- a festival feature: stage, festival tent, zone or service point; read only -->
      <div class="body" id="refPane" hidden>
        <dl class="info">
          <dt>Kind</dt><dd id="rKind"></dd>
          <dt>Position</dt><dd id="rPos"></dd>
          <dt>Notes</dt><dd id="rNotes"></dd>
        </dl>
        <div class="msg" id="rMsg"></div>
      </div>
      <div class="foot" id="refFoot" hidden>
        <button class="btn primary" id="rEdit">Edit details</button>
        <button class="btn" id="rMove">Move</button>
      </div>

      <!-- a festival feature, editing -->
      <div class="body" id="fixPane" hidden>
        <div class="field"><label for="xName">Name</label><input id="xName" maxlength="120" placeholder="For example Scène '76 or Restroom block A" /></div>
        <div class="field"><label for="xKind">Kind</label><select id="xKind"></select></div>
        <div class="field"><label for="xPos">Position</label><select id="xPos"></select></div>
        <div class="field"><label for="xNotes">Notes</label><textarea id="xNotes" maxlength="500"></textarea></div>
        <div class="msg" id="xMsg"></div>
      </div>
      <div class="foot" id="fixFoot" hidden>
        <button class="btn primary" id="xSave">Save</button>
        <button class="btn" id="xCancel">Cancel</button>
        <button class="btn danger" id="xDel">Delete</button>
      </div>

      <!-- a tent, editing -->
      <div class="body" id="editPane" hidden>
        <div class="field"><label for="fSpot">Spot number</label><input id="fSpot" maxlength="20" /></div>
        <div class="field"><label for="fSize">Tent size</label><select id="fSize"></select></div>
        <div class="two" id="fDims" hidden>
          <div class="field"><label for="fW">Width (ft)</label><input id="fW" type="number" min="1" step="1" /></div>
          <div class="field"><label for="fD">Depth (ft)</label><input id="fD" type="number" min="1" step="1" /></div>
        </div>
        <div class="field"><span class="label">Status</span><div class="seg" id="fStatus"></div></div>
        <div class="field"><label for="fRenter">Renter</label><input id="fRenter" maxlength="120" /></div>
        <div class="field"><label for="fFee">Fee ($)</label><input id="fFee" type="number" min="0" step="1" /></div>
        <div class="field"><label for="fNotes">Notes</label><textarea id="fNotes" maxlength="500"></textarea></div>
        <div class="msg" id="eMsg"></div>
      </div>
      <div class="foot" id="editFoot" hidden>
        <button class="btn primary" id="eSave">Save</button>
        <button class="btn" id="eCancel">Cancel</button>
        <button class="btn danger" id="eDel">Delete</button>
      </div>

      <!-- the spot list -->
      <div class="body" id="listPane" hidden>
        <input class="search-box" id="search" type="search" placeholder="Spot number or renter" autocomplete="off" />
        <div class="list" id="list"></div>
      </div>
      <div class="foot" id="listFoot" hidden>
        <button class="btn" id="csvBtn">Download CSV</button>
      </div>
    </aside>

    <div class="shield" id="shield" hidden></div>
    <div class="statusbar" id="statusBar" hidden><div class="sb-text" id="sbText"></div><div class="sb-track"><div class="sb-fill" id="sbFill"></div></div></div>
    <div class="blocker" id="blocker">Loading the map…</div>
  </main>

  <script type="module">
    // ---- this festival's setup ------------------------------------------------------------
    const ORTHO_URL = "https://tiles.arcgis.com/tiles/RuzrqSSqWodruOMi/arcgis/rest/services/Girard_Park_Ortho_2026_10_09/MapServer";
    const SPOTS_URL = "https://services9.arcgis.com/RuzrqSSqWodruOMi/arcgis/rest/services/Girard_Park___Tent_Spots/FeatureServer/0";
    // sizes and fees from the festival's tent village page (2026); a branded tent is at most 20 x 20;
    // a custom tent has no set fee
    const SIZES = [
      { value: "10 x 10 ft", w: 10, d: 10, fee: 100 },
      { value: "20 x 20 ft", w: 20, d: 20, fee: 150 },
      { value: "Company branded", w: 20, d: 20, fee: 500 },
      { value: "Custom", w: null, d: null, fee: null },
    ];
    const STATUSES = [
      { value: "Open", color: "#2E9E5B" }, { value: "Held", color: "#2F6FD6" },
      { value: "Rented", color: "#D9483B" }, { value: "Blocked", color: "#8A8F98" },
    ];
    const YEAR = 2027;
    const YELLOW = [253, 208, 35];
    // ----------------------------------------------------------------------------------------

    const $ = (id) => document.getElementById(id);
    const blocker = $("blocker");
    const stop = (text) => { blocker.textContent = text; blocker.hidden = false; };
    if (!window.esriConfig || !esriConfig.apiKey || esriConfig.apiKey.startsWith("PASTE")) {
      stop("This page has no key yet. Paste the ArcGIS key into index.html where it is marked.");
      throw new Error("no key");
    }

    const [Map, Basemap, TileLayer, FeatureLayer, Graphic, Polygon, Point, reactiveUtils] = await $arcgis.import([
      "@arcgis/core/Map.js", "@arcgis/core/Basemap.js", "@arcgis/core/layers/TileLayer.js",
      "@arcgis/core/layers/FeatureLayer.js", "@arcgis/core/Graphic.js", "@arcgis/core/geometry/Polygon.js",
      "@arcgis/core/geometry/Point.js", "@arcgis/core/core/reactiveUtils.js",
    ]);

    const rgba = (h, a) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), a];
    const colorOf = (s) => (STATUSES.find((x) => x.value === s) || STATUSES[0]).color;
    const ortho = new TileLayer({ url: ORTHO_URL, title: "Ortho" });
    const spots = new FeatureLayer({
      url: SPOTS_URL, title: "Tent spots", outFields: ["*"], popupEnabled: false, refreshInterval: 1,
      renderer: {
        type: "unique-value", field: "status",
        uniqueValueInfos: STATUSES.map((s) => ({
          value: s.value, label: s.value,
          symbol: { type: "simple-fill", color: rgba(s.color, 0.45), outline: { color: rgba(s.color, 1), width: 2 } },
        })),
      },
      labelingInfo: [{
        labelExpressionInfo: { expression: "$feature.spot_no" }, minScale: 5000,
        symbol: { type: "text", color: "white", haloColor: [0, 0, 0, 0.85], haloSize: 1.2,
          font: { family: "Arial", size: 10, weight: "bold" } },
      }],
    });
    // what the tents work around: the festival's stages, tents, zones and keep-clear areas, and its service points.
    // They are layers 1 and 2 of the same service, edited in Map Viewer; this page only shows them.
    const BLOCKING = ["Stage", "Festival tent", "Keep clear"];   // kinds a rented tent must not sit on
    const refLabels = [{ labelExpressionInfo: { expression: "$feature.name" }, minScale: 5000,
      symbol: { type: "text", color: "white", haloColor: [0, 0, 0, 0.85], haloSize: 1.2, font: { family: "Arial", size: 9, weight: "bold" } } }];
    const greyFill = (c) => ({ type: "simple-fill", color: [c, c, c, 0.45], outline: { color: [255, 255, 255, 0.9], width: 1.5 } });
    const layout = new FeatureLayer({
      url: SPOTS_URL.replace(/\/0$/, "/1"), title: "Festival layout", outFields: ["*"], popupEnabled: false,
      renderer: { type: "unique-value", field: "kind", defaultSymbol: greyFill(150), uniqueValueInfos: [
        { value: "Stage", symbol: greyFill(40) }, { value: "Festival tent", symbol: greyFill(85) },
        { value: "Food or craft area", symbol: greyFill(130) }, { value: "Exhibit area", symbol: greyFill(170) },
        { value: "Parking", symbol: greyFill(200) },
        { value: "Keep clear", symbol: { type: "simple-fill", style: "backward-diagonal", color: [217, 72, 59, 1],
          outline: { color: [217, 72, 59, 1], width: 2, style: "dash" } } },
      ] },
      labelingInfo: refLabels,
    });
    const services = new FeatureLayer({
      url: SPOTS_URL.replace(/\/0$/, "/2"), title: "Festival services", outFields: ["*"], popupEnabled: false,
      renderer: { type: "simple", symbol: { type: "simple-marker", style: "circle", size: 10, color: [255, 255, 255, 1],
        outline: { color: [0, 0, 0, 1], width: 2 } } },
      labelingInfo: [{ ...refLabels[0], labelPlacement: "above-center" }],
    });
    const viewElement = document.querySelector("arcgis-map");
    viewElement.map = new Map({
      basemap: new Basemap({ baseLayers: [new TileLayer({
        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer" })] }),
      layers: [ortho, layout, services, spots],
    });
    await viewElement.viewOnReady();
    try {
      await Promise.all([ortho.load(), spots.load()]);
    } catch (e) {
      stop("The map could not load its layers. The key may have expired or lost access: " + (e.message || e));
      throw e;
    }
    // the reference layers are optional: the page works without them
    const refOk = { layout: true, services: true };
    await layout.load().catch(() => { refOk.layout = false; });
    await services.load().catch(() => { refOk.services = false; });
    // open on the park and keep the view near it: the ortho is the flown park
    const park = ortho.fullExtent;
    await viewElement.goTo(park);
    // two-finger twist on a phone, right-drag on a computer; the compass puts north back up
    viewElement.constraints = { geometry: park.clone().expand(1.5), minScale: 12000, rotationEnabled: true };
    try { document.querySelector("arcgis-home").viewpoint = viewElement.viewpoint.clone(); } catch { /* home falls back to its own default */ }
    // the park's long rectangle in Web Mercator, measured on the ortho: about 2,720 by 1,115 ft,
    // its long axis 30.9 degrees east of north. The whole-park print turns the map to it and crops to it.
    const PARK_FRAME = [[-10243949.3, 3530008.0], [-10243457.7, 3530830.6], [-10243120.1, 3530628.8], [-10243611.8, 3529806.2]];
    const PARK_BEARING = 30.9;
    const layerView = await viewElement.whenLayerView(spots);
    blocker.hidden = true;
    const OID = spots.objectIdField;
    const toMap = (pt) => (viewElement.toMap ? viewElement.toMap(pt) : viewElement.view.toMap(pt));
    const toScreen = (pt) => (viewElement.toScreen ? viewElement.toScreen(pt) : viewElement.view.toScreen(pt));
    const resolution = () => viewElement.resolution ?? viewElement.view?.resolution ?? 0.1;

    // ---- geometry: a true-size rectangle in Web Mercator ---------------------------------
    // w runs across the tent, d along it; deg turns it clockwise on screen
    const R = 6378137, FT = 0.3048;
    const mercScale = (y) => 1 / Math.cos(Math.atan(Math.sinh(y / R)));
    function rect(cx, cy, w, d, deg) {
      const k = FT * mercScale(cy) / 2, hw = w * k, hd = d * k;
      const t = (deg * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
      const ring = [[-hw, -hd], [-hw, hd], [hw, hd], [hw, -hd], [-hw, -hd]].map(([x, y]) => [cx + x * c + y * s, cy - x * s + y * c]);
      return new Polygon({ rings: [ring], spatialReference: { wkid: 102100 } });
    }
    function describe(poly) {
      const r = poly.rings[0];
      const cx = (r[0][0] + r[1][0] + r[2][0] + r[3][0]) / 4, cy = (r[0][1] + r[1][1] + r[2][1] + r[3][1]) / 4;
      const deg = (Math.atan2(r[1][0] - r[0][0], r[1][1] - r[0][1]) * 180) / Math.PI;
      const unit = FT * mercScale(cy);
      const d = Math.hypot(r[1][0] - r[0][0], r[1][1] - r[0][1]) / unit;
      const w = Math.hypot(r[2][0] - r[1][0], r[2][1] - r[1][1]) / unit;
      return { cx, cy, deg, w: Math.round(w * 10) / 10, d: Math.round(d * 10) / 10 };
    }
    function insideTent(p, g) {
      const x = describe(g), t = (x.deg * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
      const dx = p.x - x.cx, dy = p.y - x.cy, k = FT * mercScale(x.cy) / 2;
      const u = dx * c - dy * s, v = dx * s + dy * c;
      return Math.abs(u) <= x.w * k && Math.abs(v) <= x.d * k;
    }
    const sizeOf = (v) => SIZES.find((s) => s.value === v) || SIZES[SIZES.length - 1];
    const sizeText = (a, g) => { const x = describe(g); return a.tent_size && a.tent_size !== "Custom" ? a.tent_size : `Custom, ${x.w} x ${x.d} ft`; };
    const money = (n) => (n == null ? "-" : `$${Number(n).toLocaleString()}`);
    const sr = { wkid: 102100 };

    // ---- the tent being worked on: outline, turning ring and knob ------------------------
    const RING_PX = 22;
    const outlineG = new Graphic();
    const ringG = new Graphic({ symbol: { type: "simple-marker", style: "circle", size: RING_PX * 2,
      color: [255, 255, 255, 0.18], outline: { color: [255, 255, 255, 1], width: 3 } } });
    const knobG = new Graphic({ symbol: { type: "simple-marker", style: "circle", size: 14,
      color: [...YELLOW, 1], outline: { color: [0, 0, 0, 1], width: 2 } } });
    viewElement.graphics.addMany([outlineG, ringG, knobG]);
    // a row: the first tent is the draft, the rest follow along its width at the set gap
    let rowGs = [];
    function rowGeometries(w) {
      if (!w?.row) return [w.geometry];
      const x = describe(w.geometry), t = (x.deg * Math.PI) / 180, c = Math.cos(t), s = Math.sin(t);
      const step = (x.w + w.row.gap) * FT * mercScale(x.cy);
      return Array.from({ length: w.row.count }, (_, i) => rect(x.cx + i * step * c, x.cy - i * step * s, x.w, x.d, x.deg));
    }
    function drawRow() {
      viewElement.graphics.removeMany(rowGs);
      rowGs = work?.row ? rowGeometries(work).slice(1).map((g) => new Graphic({ geometry: g, symbol: {
        type: "simple-fill", color: [...YELLOW, 0.25], outline: { color: [...YELLOW, 1], width: 2, style: "dash" } } })) : [];
      viewElement.graphics.addMany(rowGs);
    }
    function draw(geometry, { work = false } = {}) {
      if (!geometry) { outlineG.geometry = ringG.geometry = knobG.geometry = null; return; }
      outlineG.geometry = geometry;
      outlineG.symbol = { type: "simple-fill", color: work ? [...YELLOW, 0.35] : [0, 0, 0, 0],
        outline: { color: [...YELLOW, 1], width: 3 } };
      if (!work) { ringG.geometry = knobG.geometry = null; return; }
      const x = describe(geometry), r = RING_PX * resolution(), t = (x.deg * Math.PI) / 180;
      ringG.geometry = new Point({ x: x.cx, y: x.cy, spatialReference: sr });
      knobG.geometry = new Point({ x: x.cx + r * Math.sin(t), y: x.cy + r * Math.cos(t), spatialReference: sr });
    }
    reactiveUtils.watch(() => viewElement.scale, () => { if (work) draw(work.geometry, { work: true }); });
    // the scale on the ground at the middle of the screen, comparable with ArcGIS Pro's scale box
    function showScale() {
      const s = viewElement.scale, c = viewElement.center;
      if (!s || !c) return;
      const ground = s / mercScale(c.y);
      const nice = ground >= 1000 ? Math.round(ground / 50) * 50 : Math.round(ground / 10) * 10;
      $("scaleRead").textContent = `1:${nice.toLocaleString()}`;
    }
    reactiveUtils.watch(() => [viewElement.scale, viewElement.center?.y], showScale, { initial: true });

    // ---- state ----------------------------------------------------------------------------
    let current = null;   // the selected saved tent: { oid, geometry, attrs }
    let work = null;      // a tent being placed or adjusted: { kind: "new" | "adjust", geometry, size, oid?, armed? }
    let lastTurn = 0;     // a new tent starts at the turn of the last one placed or turned, so rows line up
    const hint = $("hint");
    const setHint = (t) => { hint.textContent = t || ""; };

    // ---- the sheet: one place for a tent, its edit form and the spot list ----------------
    const sheet = $("sheet");
    const panes = ["viewPane", "viewFoot", "editPane", "editFoot", "listPane", "listFoot", "refPane", "refFoot", "fixPane", "fixFoot"];
    function openSheet(which, title) {
      panes.forEach((p) => { $(p).hidden = !p.startsWith(which); });
      $("sTitle").textContent = title;
      sheet.hidden = false;
      padForSheet();
    }
    function closeSheet() {
      sheet.hidden = true; current = null; currentRef = null; if (!work) draw(null); padForSheet();
    }
    function padForSheet() {
      const phone = innerWidth <= 640;
      const none = { top: 0, right: 0, bottom: 0, left: 0 };
      viewElement.padding = sheet.hidden ? none : phone ? { ...none, bottom: sheet.offsetHeight } : { ...none, right: 352 };
    }
    addEventListener("resize", padForSheet);
    $("sClose").addEventListener("click", closeSheet);

    async function fetchTent(oid) {
      const fs = await spots.queryFeatures({ objectIds: [oid], outFields: ["*"], returnGeometry: true, outSpatialReference: sr });
      return fs.features[0];
    }
    async function select(oid, zoom = false) {
      const f = await fetchTent(oid);
      if (!f) return;
      current = { oid, geometry: f.geometry, attrs: f.attributes };
      draw(f.geometry);
      showTent();
      const target = zoom ? f.geometry.extent.clone().expand(5) : f.geometry;
      viewElement.goTo(target, { animate: true }).catch(() => {});
    }
    function showTent(message = "") {
      const a = current.attrs;
      const pill = $("vStatus");
      pill.textContent = a.status || "Open"; pill.style.background = colorOf(a.status);
      $("vSize").textContent = sizeText(a, current.geometry);
      $("vRenter").textContent = a.renter || "-";
      $("vFee").textContent = money(a.fee);
      $("vYear").textContent = a.year ?? "-";
      $("vNotes").textContent = a.notes || "-";
      $("vMsg").textContent = message;
      openSheet("view", a.spot_no ? `Spot ${a.spot_no}` : "Tent");
    }
    $("vEdit").addEventListener("click", () => showEdit());
    $("vMove").addEventListener("click", () => startAdjust());

    // edit form
    SIZES.forEach((s) => $("fSize").add(new Option(s.value, s.value)));
    STATUSES.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = s.value; b.dataset.s = s.value;
      b.addEventListener("click", () => markStatus(s.value));
      $("fStatus").appendChild(b);
    });
    function markStatus(v) {
      document.querySelectorAll("#fStatus button").forEach((b) => {
        const on = b.dataset.s === v; b.classList.toggle("on", on);
        b.style.background = on ? colorOf(v) : ""; b.style.borderColor = on ? colorOf(v) : "";
      });
    }
    const chosenStatus = () => document.querySelector("#fStatus button.on")?.dataset.s || "Open";
    function syncDims() {
      const s = sizeOf($("fSize").value);
      $("fDims").hidden = s.value !== "Custom";
      if (s.value !== "Custom") { $("fW").value = s.w; $("fD").value = s.d; }
    }
    $("fSize").addEventListener("change", () => { const s = sizeOf($("fSize").value); syncDims(); if (s.fee != null) $("fFee").value = s.fee; });
    function showEdit() {
      const a = current.attrs, x = describe(current.geometry);
      $("fSpot").value = a.spot_no || "";
      $("fSize").value = a.tent_size || "Custom";
      syncDims();
      if ($("fSize").value === "Custom") { $("fW").value = x.w; $("fD").value = x.d; }
      markStatus(a.status || "Open");
      $("fRenter").value = a.renter || "";
      $("fFee").value = a.fee ?? "";
      $("fNotes").value = a.notes || "";
      $("eMsg").textContent = ""; $("eMsg").className = "msg";
      disarmDelete();
      openSheet("edit", a.spot_no ? `Edit spot ${a.spot_no}` : "Edit tent");
    }
    $("eCancel").addEventListener("click", () => showTent());
    const eMsg = (t, err = false) => { $("eMsg").textContent = t; $("eMsg").className = "msg" + (err ? " err" : ""); };

    $("eSave").addEventListener("click", async () => {
      if (!current) return;
      const size = $("fSize").value, w = Number($("fW").value), d = Number($("fD").value);
      if (size === "Custom" && !(w > 0 && d > 0)) { eMsg("Give a width and depth in feet.", true); return; }
      const fields = { spot_no: $("fSpot").value.trim() || null, tent_size: size, status: chosenStatus(),
        renter: $("fRenter").value.trim() || null, fee: $("fFee").value === "" ? null : Number($("fFee").value),
        notes: $("fNotes").value.trim() || null };
      if (fields.spot_no && await spotTaken(fields.spot_no, current.oid)) {
        eMsg(`Spot ${fields.spot_no} is already used by another tent. Pick another number.`, true); return;
      }
      const x = describe(current.geometry);
      const nw = size === "Custom" ? w : sizeOf(size).w, nd = size === "Custom" ? d : sizeOf(size).d;
      const geometry = (Math.abs(nw - x.w) > 0.05 || Math.abs(nd - x.d) > 0.05) ? rect(x.cx, x.cy, nw, nd, x.deg) : null;
      try {
        await updateTent(current, fields, geometry, `Saved spot ${fields.spot_no ?? ""}`.trim());
        showTent("Saved.");
      } catch (e) { eMsg("Not saved: " + (e.message || e), true); }
    });

    let armedAt = 0;
    function disarmDelete() { armedAt = 0; $("eDel").classList.remove("armed"); $("eDel").textContent = "Delete"; }
    $("eDel").addEventListener("click", async () => {
      if (!current) return;
      if (Date.now() - armedAt > 4000) { armedAt = Date.now(); $("eDel").classList.add("armed"); $("eDel").textContent = "Tap again to delete"; return; }
      try { await deleteTent(current); closeSheet(); }
      catch (e) { disarmDelete(); eMsg("Not deleted: " + (e.message || e), true); }
    });

    // ---- edits, each one undoable ---------------------------------------------------------
    const EDITABLE = ["spot_no", "tent_size", "status", "renter", "fee", "year", "notes"];
    const undo = [];
    const pick = (a) => Object.fromEntries(EDITABLE.map((k) => [k, a[k] ?? null]));
    async function apply(edits) {
      const r = await spots.applyEdits(edits);
      const res = [...(r.addFeatureResults || []), ...(r.updateFeatureResults || []), ...(r.deleteFeatureResults || [])][0];
      if (res?.error) throw new Error(res.error.message);
      refreshCounts(); if (!$("listPane").hidden) renderList();
      return res;
    }
    function remember(entry, text) {
      undo.push(entry); if (undo.length > 30) undo.shift();
      $("undoBtn").disabled = false;
      toast(text);
    }
    async function addTents(list) {  // a row, saved in one request and undone as one
      const r = await spots.applyEdits({ addFeatures: list.map(({ geometry, attrs }) => new Graphic({ geometry, attributes: attrs })) });
      const res = r.addFeatureResults || [];
      const bad = res.find((x) => x.error);
      const oids = res.filter((x) => !x.error).map((x) => x.objectId);
      refreshCounts(); if (!$("listPane").hidden) renderList();
      if (oids.length) remember({ kind: "addMany", oids }, `Placed ${oids.length} tents, spots ${list[0].attrs.spot_no} to ${list[oids.length - 1].attrs.spot_no}`);
      if (bad) throw new Error(`${res.length - oids.length} of ${res.length} tents were not saved: ${bad.error.message}`);
      return oids;
    }
    async function addTent(geometry, attrs) {
      const res = await apply({ addFeatures: [new Graphic({ geometry, attributes: attrs })] });
      remember({ kind: "add", oid: res.objectId }, `Placed spot ${attrs.spot_no}`);
      return res.objectId;
    }
    async function updateTent(t, fields, geometry, text) {
      const before = { attrs: pick(t.attrs), geometry: t.geometry };
      await apply({ updateFeatures: [new Graphic({ attributes: { [OID]: t.oid, ...fields }, ...(geometry ? { geometry } : {}) })] });
      Object.assign(t.attrs, fields); if (geometry) t.geometry = geometry;
      if (current === t) draw(t.geometry);
      remember({ kind: "update", oid: t.oid, before }, text);
    }
    async function deleteTent(t) {
      await apply({ deleteFeatures: [{ objectId: t.oid }] });
      remember({ kind: "delete", geometry: t.geometry, attrs: pick(t.attrs) }, `Deleted spot ${t.attrs.spot_no ?? ""}`.trim());
    }
    async function undoLast() {
      const e = undo.pop();
      $("undoBtn").disabled = undo.length === 0;
      hideToast();
      if (!e) return;
      try {
        if (e.kind === "add") { await apply({ deleteFeatures: [{ objectId: e.oid }] }); if (current?.oid === e.oid) closeSheet(); }
        else if (e.kind === "addMany") {
          await apply({ deleteFeatures: e.oids.map((objectId) => ({ objectId })) });
          if (current && e.oids.includes(current.oid)) closeSheet();
        }
        else if (e.kind === "update") {
          await apply({ updateFeatures: [new Graphic({ attributes: { [OID]: e.oid, ...e.before.attrs }, geometry: e.before.geometry })] });
          if (current?.oid === e.oid) { current.attrs = { ...current.attrs, ...e.before.attrs }; current.geometry = e.before.geometry; draw(current.geometry); showTent("Change undone."); }
        } else if (e.kind === "delete") {
          const res = await apply({ addFeatures: [new Graphic({ geometry: e.geometry, attributes: e.attrs })] });
          await select(res.objectId);
        } else if (e.kind === "refAdd") {
          await applyTo(e.layer, { deleteFeatures: [{ objectId: e.oid }] });
          if (currentRef?.oid === e.oid && currentRef.layer === e.layer) closeSheet();
        } else if (e.kind === "refUpdate") {
          await applyTo(e.layer, { updateFeatures: [new Graphic({ attributes: { [e.layer.objectIdField]: e.oid, ...e.before.attrs }, geometry: e.before.geometry })] });
          if (currentRef?.oid === e.oid && currentRef.layer === e.layer) await showRef(e.layer, e.oid);
        } else if (e.kind === "refDelete") {
          const res = await applyTo(e.layer, { addFeatures: [new Graphic({ geometry: e.geometry, attributes: e.attrs })] });
          await showRef(e.layer, res.objectId);
        }
        setHint("Undone.");
        setTimeout(() => setHint(""), 1800);
      } catch (err) { setHint("Could not undo: " + (err.message || err)); }
    }
    $("undoBtn").addEventListener("click", undoLast);

    // ---- festival features: points and areas the tents work around --------------------------
    // Anyone with this page can add, change and delete them, the same as tents.
    async function applyTo(layer, edits) {
      const r = await layer.applyEdits(edits);
      const res = [...(r.addFeatureResults || []), ...(r.updateFeatureResults || []), ...(r.deleteFeatureResults || [])][0];
      if (res?.error) throw new Error(res.error.message);
      return res;
    }
    const REF_FIELDS = ["name", "kind", "position", "notes"];
    const domainOf = (layer, field) => layer.fields?.find((f) => f.name === field)?.domain?.codedValues?.map((c) => c.code) || [];
    const fill = (sel, values) => { sel.replaceChildren(); values.forEach((v) => sel.add(new Option(v, v))); };
    if (refOk.services) fill($("ptKind"), domainOf(services, "kind"));
    if (refOk.layout) fill($("arKind"), domainOf(layout, "kind"));
    $("featMenu").hidden = !(refOk.services || refOk.layout);
    $("ptGo").parentElement.hidden = !refOk.services;
    $("arGo").parentElement.hidden = !refOk.layout;

    let currentRef = null;   // { layer, oid, geometry, attrs }
    let refWork = null;      // { mode: "point" | "area" | "move", layer, kind, geometry?, verts? }
    const refDraft = new Graphic();
    let vertGs = [];
    viewElement.graphics.add(refDraft);

    async function showRef(layer, oid, message = "") {
      const fs = await layer.queryFeatures({ objectIds: [oid], outFields: ["*"], returnGeometry: true, outSpatialReference: sr });
      const f = fs.features[0];
      if (!f) return;
      current = null; draw(null);
      currentRef = { layer, oid, geometry: f.geometry, attrs: f.attributes };
      const a = f.attributes;
      $("rKind").textContent = a.kind || "-";
      $("rPos").textContent = a.position || "-";
      $("rNotes").textContent = a.notes || "-";
      $("rMsg").textContent = message;
      $("rMove").hidden = layer !== services;   // areas are redrawn rather than moved
      openSheet("ref", a.name || a.kind || "Festival feature");
    }
    function showFix(message = "") {
      const { layer, attrs: a } = currentRef;
      $("xName").value = a.name || "";
      fill($("xKind"), domainOf(layer, "kind")); $("xKind").value = a.kind || "";
      fill($("xPos"), domainOf(layer, "position")); $("xPos").value = a.position || "";
      $("xNotes").value = a.notes || "";
      $("xMsg").textContent = message; $("xMsg").className = "msg";
      xDisarm();
      openSheet("fix", a.name ? `Edit ${a.name}` : `Edit ${(a.kind || "feature").toLowerCase()}`);
      if (!a.name) $("xName").focus();
    }
    $("rEdit").addEventListener("click", () => showFix());
    $("xCancel").addEventListener("click", () => showRef(currentRef.layer, currentRef.oid));
    $("xSave").addEventListener("click", async () => {
      if (!currentRef) return;
      const { layer, oid, attrs, geometry } = currentRef;
      const fields = { name: $("xName").value.trim() || null, kind: $("xKind").value, position: $("xPos").value,
        notes: $("xNotes").value.trim() || null };
      try {
        await applyTo(layer, { updateFeatures: [new Graphic({ attributes: { [layer.objectIdField]: oid, ...fields } })] });
        remember({ kind: "refUpdate", layer, oid, before: { attrs: Object.fromEntries(REF_FIELDS.map((k) => [k, attrs[k] ?? null])), geometry } },
          `Saved ${fields.name || fields.kind}`);
        await showRef(layer, oid, "Saved.");
      } catch (e) { $("xMsg").textContent = "Not saved: " + (e.message || e); $("xMsg").className = "msg err"; }
    });
    let xArmedAt = 0;
    function xDisarm() { xArmedAt = 0; $("xDel").classList.remove("armed"); $("xDel").textContent = "Delete"; }
    $("xDel").addEventListener("click", async () => {
      if (!currentRef) return;
      if (Date.now() - xArmedAt > 4000) { xArmedAt = Date.now(); $("xDel").classList.add("armed"); $("xDel").textContent = "Tap again to delete"; return; }
      const { layer, oid, attrs, geometry } = currentRef;
      try {
        await applyTo(layer, { deleteFeatures: [{ objectId: oid }] });
        remember({ kind: "refDelete", layer, geometry, attrs: Object.fromEntries(REF_FIELDS.map((k) => [k, attrs[k] ?? null])) },
          `Deleted ${attrs.name || attrs.kind}`);
        closeSheet();
      } catch (e) { xDisarm(); $("xMsg").textContent = "Not deleted: " + (e.message || e); $("xMsg").className = "msg err"; }
    });

    // drawing: a point is one tap; an area is a tap at each corner
    function drawRef() {
      viewElement.graphics.removeMany(vertGs); vertGs = [];
      if (!refWork) { refDraft.geometry = null; return; }
      const yellow = [...YELLOW, 1];
      if (refWork.mode === "area") {
        const v = refWork.verts;
        refDraft.geometry = v.length >= 3 ? new Polygon({ rings: [[...v, v[0]]], spatialReference: sr }) : null;
        refDraft.symbol = { type: "simple-fill", color: [...YELLOW, 0.3], outline: { color: yellow, width: 2.5, style: "dash" } };
        vertGs = v.map(([x, y]) => new Graphic({ geometry: new Point({ x, y, spatialReference: sr }),
          symbol: { type: "simple-marker", style: "square", size: 10, color: yellow, outline: { color: [0, 0, 0, 1], width: 1.5 } } }));
        viewElement.graphics.addMany(vertGs);
      } else {
        refDraft.geometry = refWork.geometry || null;
        refDraft.symbol = { type: "simple-marker", style: "circle", size: 16, color: yellow, outline: { color: [0, 0, 0, 1], width: 2 } };
      }
    }
    function showRefWork(text) {
      const w = refWork;
      $("rbTitle").textContent = w.mode === "move" ? `Moving ${currentRef?.attrs.name || currentRef?.attrs.kind || "point"}`
        : w.mode === "point" ? `New ${w.kind.toLowerCase()} point` : `New ${w.kind.toLowerCase()} area, ${w.verts.length} corners`;
      $("rbText").textContent = text || (w.mode === "area" ? "Tap each corner in order. Save when the outline is right."
        : "Tap where it goes. Tap again to change the spot.");
      $("rbBack").hidden = w.mode !== "area";
      $("rbBack").disabled = w.mode === "area" && !w.verts.length;
      $("rbOk").disabled = w.mode === "area" ? w.verts.length < 3 : !w.geometry;
      $("actions").hidden = true; $("refbar").hidden = false; menu.hidden = true;
      drawRef();
    }
    function endRefWork() { refWork = null; drawRef(); $("refbar").hidden = true; $("actions").hidden = false; }
    function startRef(mode, layer, kind) {
      if (work) $("wCancel").click();
      if (measuring) setMeasuring(false);
      if (mode !== "move") closeSheet(); else sheet.hidden = true;
      refWork = { mode, layer, kind, verts: [], geometry: null };
      showRefWork();
    }
    $("ptGo").addEventListener("click", () => startRef("point", services, $("ptKind").value));
    $("arGo").addEventListener("click", () => startRef("area", layout, $("arKind").value));
    $("rMove").addEventListener("click", () => { if (currentRef) startRef("move", currentRef.layer, currentRef.attrs.kind); });
    $("rbBack").addEventListener("click", () => { if (refWork?.verts.length) { refWork.verts.pop(); showRefWork(); } });
    $("rbCancel").addEventListener("click", () => {
      const moving = refWork?.mode === "move"; endRefWork();
      if (moving && currentRef) showRef(currentRef.layer, currentRef.oid);
    });
    function refTap(p) {
      if (refWork.mode === "area") refWork.verts.push([p.x, p.y]);
      else refWork.geometry = new Point({ x: p.x, y: p.y, spatialReference: sr });
      showRefWork();
    }
    $("rbOk").addEventListener("click", async () => {
      const w = refWork; if (!w) return;
      $("rbOk").disabled = true;
      try {
        if (w.mode === "move") {
          const { layer, oid, attrs, geometry } = currentRef;
          await applyTo(layer, { updateFeatures: [new Graphic({ attributes: { [layer.objectIdField]: oid }, geometry: w.geometry })] });
          remember({ kind: "refUpdate", layer, oid, before: { attrs: Object.fromEntries(REF_FIELDS.map((k) => [k, attrs[k] ?? null])), geometry } },
            `Moved ${attrs.name || attrs.kind}`);
          endRefWork();
          await showRef(layer, oid, "Moved.");
          return;
        }
        let geometry = w.geometry;
        if (w.mode === "area") {
          const ring = [...w.verts, w.verts[0]];
          let twice = 0;   // ArcGIS wants an outer ring clockwise: a positive shoelace sum here means clockwise
          for (let i = 0; i < ring.length - 1; i++) twice += (ring[i + 1][0] - ring[i][0]) * (ring[i + 1][1] + ring[i][1]);
          geometry = new Polygon({ rings: [twice > 0 ? ring : ring.slice().reverse()], spatialReference: sr });
        }
        const attrs = { kind: w.kind, position: "Approximate" };
        const res = await applyTo(w.layer, { addFeatures: [new Graphic({ geometry, attributes: attrs })] });
        remember({ kind: "refAdd", layer: w.layer, oid: res.objectId }, `Added ${w.kind.toLowerCase()}`);
        endRefWork();
        await showRef(w.layer, res.objectId);
        showFix("");
      } catch (e) { showRefWork("Not saved: " + (e.message || e)); }
    });

    // ---- measuring: while it is on, taps draw the measurement instead of picking tents ----
    const measureEl = $("measure");
    let measuring = false;
    function setMeasuring(on) {
      measuring = on;
      measureEl.hidden = !on;
      $("measureBtn").classList.toggle("dark", on);
      $("measureBtn").setAttribute("aria-pressed", String(on));
      $("measureBtn").textContent = on ? "Stop measuring" : "Measure";
      if (on) {
        if (work) $("wCancel").click();
        closeSheet();
        setHint("Tap points on the map to measure, double-tap to finish.");
        try { measureEl.start?.(); } catch { /* the panel's own button starts it */ }
      } else {
        try { measureEl.clear?.(); } catch { /* nothing to clear */ }
        setHint("");
      }
    }
    $("measureBtn").addEventListener("click", () => setMeasuring(!measuring));

    // ---- PDF: the whole park, the current view or a drawn box, at a paper size, with layers -------------
    // The ortho and the basemap are pictures (captured screen by screen and joined, as ArcGIS Pro rasterises
    // them too); tents, festival features, labels, legend, scale bar and north arrow are vector shapes and
    // text. Every part sits in its own PDF layer, nested as ArcGIS Pro nests them: layout, map, layers.
    const printMenu = $("printMenu");
    $("printBtn").addEventListener("click", () => { printMenu.hidden = !printMenu.hidden; menu.hidden = true; if (!printMenu.hidden) showPlan(); });
    document.addEventListener("click", (e) => { if (!printMenu.hidden && !e.target.closest("#printMenu, #printBtn")) printMenu.hidden = true; });
    const shoot = (o) => (viewElement.takeScreenshot ? viewElement.takeScreenshot(o) : viewElement.view.takeScreenshot(o));
    const settle = () => reactiveUtils.whenOnce(() => !viewElement.updating);
    const loadImg = (src) => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
    const rot = () => viewElement.rotation ?? viewElement.view?.rotation ?? 0;
    let printing = false;

    // the area: whole park, what is on screen, or a box dragged on the map
    let pdfArea = "park", boxCorners = null, drawingBox = false, boxStart = null;
    const boxG = new Graphic();
    viewElement.graphics.add(boxG);
    function setArea(a) {
      pdfArea = a;
      document.querySelectorAll("#pdfArea button").forEach((b) => b.classList.toggle("on", b.dataset.area === a));
      if (a !== "box") boxG.geometry = null;
      showPlan();
    }
    document.querySelectorAll("#pdfArea button").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.area === "box") { printMenu.hidden = true; drawingBox = true; setHint("Drag a box over the area for the PDF."); }
      else setArea(b.dataset.area);
    }));
    function boxDrag(e) {
      if (e.action === "start") boxStart = { x: e.x, y: e.y };
      if (!boxStart) return;
      const c = [[boxStart.x, boxStart.y], [e.x, boxStart.y], [e.x, e.y], [boxStart.x, e.y]].map(([x, y]) => toMap({ x, y }));
      if (c.every(Boolean)) {
        boxCorners = c.map((p) => [p.x, p.y]);
        boxG.geometry = new Polygon({ rings: [[...boxCorners, boxCorners[0]]], spatialReference: sr });
        boxG.symbol = { type: "simple-fill", color: [...YELLOW, 0.15], outline: { color: [...YELLOW, 1], width: 2, style: "dash" } };
      }
      if (e.action === "end") {
        drawingBox = false; boxStart = null; setHint("");
        setArea(boxCorners ? "box" : "park");
        printMenu.hidden = false;
      }
    }
    function screenCorners() {
      const w = viewElement.clientWidth || innerWidth, h = viewElement.clientHeight || innerHeight;
      return [[0, 0], [w, 0], [w, h], [0, h]].map(([x, y]) => toMap({ x, y })).map((p) => [p.x, p.y]);
    }
    const areaCorners = () => (pdfArea === "box" && boxCorners ? boxCorners : pdfArea === "view" ? screenCorners() : PARK_FRAME);
    const areaName = () => ({ park: "whole park", view: "current view", box: "drawn box" })[pdfArea];

    // a frame: the area seen in the map's turn, measured in screen pixels at a ground scale
    function frameOf(corners, groundScale, rotation) {
      const cx = corners.reduce((s, p) => s + p[0], 0) / corners.length, cy = corners.reduce((s, p) => s + p[1], 0) / corners.length;
      const scale = groundScale * mercScale(cy), res = scale / (96 * 39.3701);   // map units per screen pixel
      const t = (rotation * Math.PI) / 180, right = [Math.cos(t), Math.sin(t)], down = [Math.sin(t), -Math.cos(t)];
      const us = corners.map(([x, y]) => ((x - cx) * right[0] + (y - cy) * right[1]) / res);
      const vs = corners.map(([x, y]) => ((x - cx) * down[0] + (y - cy) * down[1]) / res);
      const u0 = Math.min(...us), v0 = Math.min(...vs);
      return { cx, cy, scale, res, right, down, u0, v0, W: Math.max(...us) - u0, H: Math.max(...vs) - v0, rotation };
    }
    const inFrame = (f, x, y) => [((x - f.cx) * f.right[0] + (y - f.cy) * f.right[1]) / f.res - f.u0,
                                  ((x - f.cx) * f.down[0] + (y - f.cy) * f.down[1]) / f.res - f.v0];

    // the plan: paper, orientation, the ground scale (chosen, or the one that fills the paper), ortho detail
    function pdfPlan() {
      const [long, short] = $("printPaper").value.split("x").map(Number);
      const portrait = $("pdfOrient").value === "portrait";
      const pw = portrait ? short : long, ph = portrait ? long : short;
      const T = Math.round(10 + long * 0.95), S = Math.round(T * 0.45);
      const topIn = (T + S + 24) / 72, bottomIn = Math.max(54, T * 1.6) / 72;
      const mapW = pw - 1, mapH = ph - 1 - topIn - bottomIn;
      const f1 = frameOf(areaCorners(), 1, rot());            // at 1:1 one screen pixel is 1/96 in of ground
      const gw = f1.W / 96, gh = f1.H / 96;                   // ground size in inches
      const fit = Math.ceil((Math.max(gw / mapW, gh / mapH) * 1.02) / 10) * 10;
      const scale = Number($("printScale").value) || fit;
      const dpi = Math.max(72, Math.min(Number($("pdfDpi").value) || 300, Math.floor(16000 / ((devicePixelRatio || 1) * (Math.max(gw, gh) / scale)))));
      return { long, short, pw, ph, T, S, topIn, bottomIn, mapW, mapH, scale, fit, dpi, rotation: rot(),
        paperName: $("printPaper").selectedOptions[0].textContent.split(",")[0] };
    }
    function showPlan() {
      const p = pdfPlan();
      $("printPlan").textContent = `${p.paperName} ${p.pw > p.ph ? "landscape" : "portrait"}: ${areaName()} at 1:${p.scale.toLocaleString()} on the ground, ortho at ${p.dpi} dpi.` +
        (p.scale < p.fit ? " At this scale it is bigger than the paper, so it is shrunk to fit." : "");
    }
    ["printPaper", "printScale", "pdfOrient", "pdfDpi"].forEach((id) => $(id).addEventListener("change", showPlan));

    // screen-sized pictures across the frame, joined into one; see-through where nothing is drawn
    async function stitch(f, transparent, onPart) {
      viewElement.constraints = { rotationEnabled: true, snapToZoom: false };
      const vw = viewElement.clientWidth || innerWidth, vh = viewElement.clientHeight || innerHeight;
      const nx = Math.ceil(f.W / vw), ny = Math.ceil(f.H / vh);
      let canvas = null, ctx = null, k = 1;
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          onPart?.();
          const pu = f.u0 + i * vw + vw / 2, pv = f.v0 + j * vh + vh / 2;
          const center = new Point({ x: f.cx + (pu * f.right[0] + pv * f.down[0]) * f.res,
                                     y: f.cy + (pu * f.right[1] + pv * f.down[1]) * f.res, spatialReference: sr });
          await viewElement.goTo({ center, scale: f.scale, rotation: f.rotation }, { animate: false });
          await settle();
          const img = await loadImg((await shoot({ format: "png" })).dataUrl);
          if (!canvas) {
            k = img.width / vw;
            canvas = document.createElement("canvas");
            canvas.width = Math.ceil(f.W * k); canvas.height = Math.ceil(f.H * k);
            ctx = canvas.getContext("2d");
            if (!transparent) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          }
          ctx.drawImage(img, i * vw * k, j * vh * k, vw * k, vh * k);
        }
      }
      return transparent ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.92);
    }
    const partsOf = (f) => Math.ceil(f.W / (viewElement.clientWidth || innerWidth)) * Math.ceil(f.H / (viewElement.clientHeight || innerHeight));

    // the status screen while the PDF is built: a solid screen over the map (it jumps about while it is
    // captured), with the percentage and the part count only
    function status(part, parts) {
      $("statusBar").hidden = false; $("shield").hidden = false;
      const pct = parts ? Math.round((Math.min(part, parts) / parts) * 100) : 0;
      $("sbText").textContent = parts ? `${pct}%  ·  Part ${Math.min(part, parts)} of ${parts}` : "Starting…";
      $("sbFill").style.width = `${pct}%`;
    }
    function statusDone() { $("statusBar").hidden = true; $("shield").hidden = true; }

    // pdf-lib as a module: the classic script build registered itself with the ArcGIS loader's global
    // define() instead of setting window.PDFLib, so it never appeared
    function loadScript(src) {
      return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    }
    let pdfLibModule = null;
    async function pdfLib() {
      if (pdfLibModule) return pdfLibModule;
      for (const src of ["https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js",
                         "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.esm.min.js"]) {
        try { pdfLibModule = await import(src); if (pdfLibModule.PDFDocument) return pdfLibModule; } catch { /* next source */ }
      }
      const keepDefine = window.define;
      try { window.define = undefined; await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"); }
      finally { window.define = keepDefine; }
      if (!window.PDFLib) throw new Error("the PDF library did not load; check the connection and try again");
      return (pdfLibModule = window.PDFLib);
    }
    $("pdfGo").addEventListener("click", () => makePdf());

    async function makePdf() {
      if (printing) return;
      printing = true;
      printMenu.hidden = true;
      const keep = current;
      if (work) $("wCancel").click();
      if (refWork) $("rbCancel").click();
      if (measuring) setMeasuring(false);
      closeSheet();
      const plan = pdfPlan();
      const corners = areaCorners();
      boxG.geometry = null;
      const before = viewElement.viewpoint?.clone();
      const keepConstraints = viewElement.constraints;
      const base = viewElement.map.basemap?.baseLayers?.toArray?.() || [];
      const toggled = [ortho, layout, services, spots, ...base];
      const keepVisible = toggled.map((l) => l.visible);
      try {
        status(0, 0);
        const L = await pdfLib();
        const { PDFDocument, StandardFonts, rgb, PDFName, PDFHexString, PDFOperator } = L;

        // pictures: basemap and ortho, each alone
        const f = frameOf(corners, (plan.scale * 96) / plan.dpi, plan.rotation);
        const passes = [{ name: "Imagery basemap", layers: base, transparent: false }, { name: "Drone ortho", layers: [ortho], transparent: true }]
          .filter((p) => p.layers.length);
        const total = partsOf(f) * passes.length + 1;   // every capture, plus writing the file
        let done = 0;
        const shots = {};
        status(0, total);
        for (const p of passes) {
          toggled.forEach((l) => { l.visible = p.layers.includes(l); });
          shots[p.name] = await stitch(f, p.transparent, () => status(++done, total));
        }

        // vectors: the features themselves
        status(total - 1, total);
        const q = { where: "1=1", outFields: ["*"], returnGeometry: true, outSpatialReference: sr };
        const tents = $("pdfTents").checked ? (await spots.queryFeatures(q)).features : [];
        const areas = $("pdfFeat").checked && refOk.layout ? (await layout.queryFeatures(q)).features : [];
        const points = $("pdfFeat").checked && refOk.services ? (await services.queryFeatures(q)).features : [];

        status(total, total);
        const doc = await PDFDocument.create();
        const title = $("pdfTitle").value.trim(), sub = $("pdfSub").value.trim();
        doc.setTitle(`${title || "Festival plan"} - ${plan.paperName}`);
        const PW = plan.pw * 72, PH = plan.ph * 72, M = 36, T = plan.T, S = plan.S;
        const page = doc.addPage([PW, PH]);
        const font = await doc.embedFont(StandardFonts.Helvetica), bold = await doc.embedFont(StandardFonts.HelveticaBold);
        const area = { x: M, y: M + plan.bottomIn * 72, w: plan.mapW * 72, h: plan.mapH * 72 };
        let iw = (f.W / plan.dpi) * 72, ih = (f.H / plan.dpi) * 72;   // true scale on paper
        const shrink = Math.min(1, area.w / iw, area.h / ih);
        iw *= shrink; ih *= shrink;
        const actual = plan.scale / shrink;
        const ix = area.x + (area.w - iw) / 2, iy = area.y + (area.h - ih) / 2;
        const ptsPerFt = (12 / actual) * 72;
        const toPage = ([x, y]) => { const [u, v] = inFrame(f, x, y); return [ix + (u / f.W) * iw, iy + ih - (v / f.H) * ih]; };
        const svgOf = (rings) => rings.map((r) => r.map((pt, i) => { const [px, py] = toPage(pt); return `${i ? "L" : "M"} ${px.toFixed(2)} ${(PH - py).toFixed(2)}`; }).join(" ") + " Z").join(" ");
        const col = (hex) => rgb(...rgba(hex, 1).slice(0, 3).map((v) => v / 255));
        const centroid = (ring) => { const n = ring.length - 1 || 1; return [ring.slice(0, n).reduce((s, p) => s + p[0], 0) / n, ring.slice(0, n).reduce((s, p) => s + p[1], 0) / n]; };

        // PDF layers, nested like ArcGIS Pro's: an OCG per name, an Order tree, marked content round each part
        const ctx = doc.context, props = ctx.obj({});
        const BDC = (L.PDFOperatorNames && L.PDFOperatorNames.BeginMarkedContentSequence) || "BDC";
        const EMC = (L.PDFOperatorNames && L.PDFOperatorNames.EndMarkedContent) || "EMC";
        const allRefs = [];
        let tagN = 0;
        const ocg = (name) => { const r = ctx.register(ctx.obj({ Type: "OCG", Name: PDFHexString.fromText(name) })); allRefs.push(r); return r; };
        const open = (r) => { const tag = `oc${++tagN}`; props.set(PDFName.of(tag), r); page.pushOperators(PDFOperator.of(BDC, [PDFName.of("OC"), PDFName.of(tag)])); };
        const close = () => page.pushOperators(PDFOperator.of(EMC));
        const layer = (r, draw) => { open(r); draw(); close(); };

        const gLayout = ocg(title || "Layout"), gMap = ocg("Map");
        const gTents = tents.length ? ocg("Tent spots") : null;
        const gStatus = gTents ? STATUSES.map((s) => ({ s, r: ocg(s.value) })) : [];
        const gSpotNo = gTents ? ocg("Spot numbers") : null;
        const gServices = points.length ? ocg("Festival services") : null;
        const gAreas = areas.length ? ocg("Festival layout") : null;
        const gNames = areas.length || points.length ? ocg("Feature names") : null;
        const gOrtho = shots["Drone ortho"] ? ocg("Drone ortho") : null;
        const gBase = shots["Imagery basemap"] ? ocg("Imagery basemap") : null;
        const gFrame = ocg("Map frame");
        const gLegend = $("pdfLegend").checked && tents.length ? ocg("Legend") : null;
        const gScale = ocg("Scale bar"), gNorth = ocg("North arrow"), gTitle = ocg("Title"), gSub = sub ? ocg("Subtitle") : null;
        const gAttr = ocg("Data source attribution");

        open(gLayout);
        open(gMap);
        page.pushOperators(L.pushGraphicsState(), L.rectangle(ix, iy, iw, ih), L.clip(), L.endPath());
        for (const [g, name] of [[gBase, "Imagery basemap"], [gOrtho, "Drone ortho"]]) {
          if (!g) continue;
          const bytes = await (await fetch(shots[name])).arrayBuffer();
          const img = name === "Imagery basemap" ? await doc.embedJpg(bytes) : await doc.embedPng(bytes);
          layer(g, () => page.drawImage(img, { x: ix, y: iy, width: iw, height: ih }));
        }
        if (gAreas) layer(gAreas, () => areas.forEach((a) => {
          const k = a.attributes.kind;
          if (k === "Keep clear") page.drawSvgPath(svgOf(a.geometry.rings), { x: 0, y: PH, color: col("#D9483B"), opacity: 0.25, borderColor: col("#D9483B"), borderWidth: 1.5, borderDashArray: [6, 4] });
          else {
            const shade = { "Stage": 40, "Festival tent": 85, "Food or craft area": 130, "Exhibit area": 170, "Parking": 200 }[k] ?? 150;
            page.drawSvgPath(svgOf(a.geometry.rings), { x: 0, y: PH, color: rgb(shade / 255, shade / 255, shade / 255), opacity: 0.45, borderColor: rgb(1, 1, 1), borderWidth: 1 });
          }
        }));
        if (gServices) layer(gServices, () => points.forEach((p) => {
          const [px, py] = toPage([p.geometry.x, p.geometry.y]);
          page.drawCircle({ x: px, y: py, size: 3.5, color: rgb(1, 1, 1), borderColor: rgb(0, 0, 0), borderWidth: 1.2 });
        }));
        if (gTents) {
          open(gTents);
          gStatus.forEach(({ s, r }) => layer(r, () => tents.filter((t) => (t.attributes.status || "Open") === s.value).forEach((t) => {
            page.drawSvgPath(svgOf(t.geometry.rings), { x: 0, y: PH, color: col(s.color), opacity: 0.45, borderColor: col(s.color), borderWidth: 1 });
          })));
          layer(gSpotNo, () => tents.forEach((t) => {
            const no = String(t.attributes.spot_no ?? ""); if (!no) return;
            const d = describe(t.geometry), side = Math.min(d.w, d.d) * ptsPerFt;
            const size = Math.max(3.5, Math.min(10, side * 0.5));
            const [px, py] = toPage([d.cx, d.cy]);
            page.drawText(no, { x: px - bold.widthOfTextAtSize(no, size) / 2, y: py - size * 0.35, size, font: bold, color: rgb(0, 0, 0) });
          }));
          close();
        }
        if (gNames) layer(gNames, () => {
          areas.forEach((a) => {
            const n = a.attributes.name; if (!n) return;
            const [px, py] = toPage(centroid(a.geometry.rings[0]));
            page.drawText(n, { x: px - bold.widthOfTextAtSize(n, 7) / 2, y: py - 2.5, size: 7, font: bold, color: rgb(0, 0, 0) });
          });
          points.forEach((p) => {
            const n = p.attributes.name || p.attributes.kind; if (!n) return;
            const [px, py] = toPage([p.geometry.x, p.geometry.y]);
            page.drawText(n, { x: px - font.widthOfTextAtSize(n, 6.5) / 2, y: py + 5, size: 6.5, font: bold, color: rgb(0, 0, 0) });
          });
        });
        page.pushOperators(L.popGraphicsState());
        layer(gFrame, () => page.drawRectangle({ x: ix, y: iy, width: iw, height: ih, borderColor: rgb(0, 0, 0), borderWidth: 0.75 }));
        close();   // map

        const black = rgb(0, 0, 0), grey = rgb(0.4, 0.4, 0.4);
        if (gLegend) {
          const counts = Object.fromEntries(STATUSES.map((s) => [s.value, 0]));
          let booked = 0;
          tents.forEach((t) => { const st = t.attributes.status || "Open"; counts[st] = (counts[st] || 0) + 1; if (st === "Rented") booked += t.attributes.fee || 0; });
          layer(gLegend, () => {
            let x = M; const y = M + plan.bottomIn * 72 * 0.45, sw = S * 0.9;
            STATUSES.forEach((s) => {
              page.drawRectangle({ x, y, width: sw, height: sw, color: col(s.color), opacity: 0.45, borderColor: col(s.color), borderWidth: 1.5 });
              const label = `${s.value} ${counts[s.value]}`;
              page.drawText(label, { x: x + sw + 5, y: y + 1, size: S * 0.85, font, color: black });
              x += sw + 5 + font.widthOfTextAtSize(label, S * 0.85) + S * 1.6;
            });
            page.drawText(`Rented fees ${money(booked)}`, { x, y: y + 1, size: S * 0.85, font: bold, color: black });
          });
        }
        layer(gScale, () => {
          const ftPerPt = 1 / ptsPerFt, target = iw * 0.25 * ftPerPt;
          const nice = [10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000].filter((v) => v <= target).pop() || 10;
          const len = nice * ptsPerFt, h = Math.max(4, T * 0.15), x0 = PW / 2 - len / 2, y0 = M + plan.bottomIn * 72 * 0.45;
          for (let i = 0; i < 4; i++) page.drawRectangle({ x: x0 + (i * len) / 4, y: y0, width: len / 4, height: h, color: i % 2 ? rgb(1, 1, 1) : black, borderColor: black, borderWidth: 0.75 });
          const ls = S * 0.75;
          [[0, "0"], [len / 2, String(nice / 2)], [len, `${nice} ft`]].forEach(([dx, t]) => page.drawText(t, { x: x0 + dx - font.widthOfTextAtSize(t, ls) / 2, y: y0 + h + 4, size: ls, font, color: black }));
          const sc = `Scale 1:${Math.round(actual).toLocaleString()} on the ground`;
          page.drawText(sc, { x: PW / 2 - font.widthOfTextAtSize(sc, ls) / 2, y: y0 - ls - 4, size: ls, font, color: grey });
        });
        layer(gNorth, () => {
          const R = T * 0.6, cx = PW - M - R * 1.6, cy = M + plan.bottomIn * 72 * 0.5, t = (plan.rotation * Math.PI) / 180;
          const turn = ([x, y]) => [x * Math.cos(t) - y * Math.sin(t), x * Math.sin(t) + y * Math.cos(t)];
          const p = [[0, -R], [R * 0.55, R * 0.75], [0, R * 0.4], [-R * 0.55, R * 0.75]].map(turn);
          page.drawSvgPath(`M ${p[0][0]} ${p[0][1]} L ${p[1][0]} ${p[1][1]} L ${p[2][0]} ${p[2][1]} L ${p[3][0]} ${p[3][1]} Z`, { x: cx, y: cy, color: black });
          const [nx, ny] = turn([0, -R * 1.45]);
          page.drawText("N", { x: cx + nx - S * 0.3, y: cy - ny - S * 0.35, size: S * 0.9, font: bold, color: black });
        });
        layer(gTitle, () => page.drawText(title, { x: M, y: PH - M - T, size: T, font: bold, color: black }));
        if (gSub) layer(gSub, () => page.drawText(sub, { x: M, y: PH - M - T - S - 8, size: S, font, color: grey }));
        layer(gAttr, () => page.drawText("Basemap: Esri World Imagery. Drone ortho flown 2026-10-09.", { x: ix, y: iy - 9, size: 6.5, font, color: grey }));
        close();   // layout
        page.node.Resources().set(PDFName.of("Properties"), props);

        // spot info: a table on following pages of the same size
        if ($("pdfInfo").checked && tents.length) {
          const rows = tents.map((t) => t.attributes).sort((a, b) => (parseInt(a.spot_no, 10) || 1e9) - (parseInt(b.spot_no, 10) || 1e9));
          const cols = [["Spot", "spot_no", 0.07], ["Size", "tent_size", 0.14], ["Status", "status", 0.09], ["Renter", "renter", 0.27], ["Fee", "fee", 0.08], ["Notes", "notes", 0.35]];
          const fs = 9, lh = 14, usable = PW - 2 * M;
          const fitText = (s, w) => { s = String(s ?? ""); while (s && font.widthOfTextAtSize(s, fs) > w - 6) s = s.slice(0, -2) + "…"; return s; };
          let pg = null, y = 0;
          const header = () => {
            pg = doc.addPage([PW, PH]); y = PH - M;
            pg.drawText(`${title} - spot info`, { x: M, y: y - 16, size: 16, font: bold, color: black }); y -= 36;
            let x = M; cols.forEach(([h, , w]) => { pg.drawText(h.toUpperCase(), { x, y, size: 7.5, font: bold, color: grey }); x += usable * w; });
            pg.drawLine({ start: { x: M, y: y - 4 }, end: { x: PW - M, y: y - 4 }, thickness: 1.2, color: black }); y -= lh + 2;
          };
          header();
          rows.forEach((r) => {
            if (y < M + lh) header();
            let x = M;
            cols.forEach(([, key, w]) => {
              const v = key === "fee" ? (r.fee == null ? "" : money(r.fee)) : r[key];
              pg.drawText(fitText(v, usable * w), { x, y, size: fs, font, color: black }); x += usable * w;
            });
            pg.drawLine({ start: { x: M, y: y - 4 }, end: { x: PW - M, y: y - 4 }, thickness: 0.3, color: rgb(0.8, 0.8, 0.8) });
            y -= lh;
          });
        }

        // the layer tree, as ArcGIS Pro writes it: layout > map > layers, then the layout's elements
        const mapKids = [gTents, gTents ? [...gStatus.map((x) => x.r), gSpotNo] : null, gNames, gServices, gAreas, gOrtho, gBase, gFrame].filter(Boolean);
        const order = [gLayout, [gMap, mapKids, gLegend, gScale, gNorth, gTitle, gSub, gAttr].filter(Boolean)];
